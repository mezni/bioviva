[package]
name = "bioivara-infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
bioivara-application = { path = "../application" }
bioivara-domain = { path = "../domain" }
sqlx = { version = "0.7", features = ["postgres", "uuid"] }
tokio = { version = "1.38", features = ["full"] }
argon2 = "0.6"
jsonwebtoken = "9.3"
tracing = "0.1"
tracing-subscriber = "0.3"