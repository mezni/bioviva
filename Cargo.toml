[workspace]
resolver = "2"
members = [
    "crates/gateway-core",
    "crates/gateway-application",
    "crates/gateway-infrastructure",
    "crates/gateway-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime and HTTP
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "charset"
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors and identifiers
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database and coordination
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate"
] }
redis = { version = "0.27", features = ["tokio-comp"] }

# Testing
anyhow = "1"
